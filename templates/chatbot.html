<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Symptom Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1f89f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chatbox {
            background: white;
            width: 600px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #724ab3;
        }

        .response {
            margin-top: 15px;
            padding: 10px;
            background: #eef;
            border-radius: 5px;
            min-height: 50px;
        }

        .disclaimer {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="chatbox">
    <h2>SYMPTOM CHECKER CHATBOT</h2>

    <textarea id="userInput" placeholder="Describe your symptoms..."></textarea>

    <button onclick="sendMessage()">Check Symptoms</button>

    <div class="response" id="botReply"></div>

    <div class="disclaimer">
        ⚠ This is not a medical diagnosis. Please consult a doctor.
    </div>
</div>

<script>
    async function sendMessage() {
    const input = document.getElementById("userInput");
    const replyBox = document.getElementById("botReply");

    if (input.value.trim() === "") {
        replyBox.innerText = "Please enter your symptoms.";
        return;
    }

    replyBox.innerText = "Analyzing symptoms...";

    const response = await fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: input.value })  
    });

    const data = await response.json();
    replyBox.innerText = data.answer;  
}
 

</script>


</body>
</html>
